<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>這一世不太對</title>
<style>
:root{
--paper:#f4ead6;
--paper2:#ece0c7;
--ink:#2b2320;
--ink2:#6b5e52;
--line:#cbb896;
--red:#9c2b24;
--serif:"標楷體","DFKai-SB","Noto Serif TC","Songti TC",serif;
--sans:"微軟正黑體","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
background:#241f1b;
color:var(--ink);
font-family:var(--sans);
font-size:16px;
line-height:1.85;
display:flex;
justify-content:center;
min-height:100vh;
}
#app{
width:100%;
max-width:480px;
background:var(--paper);
min-height:100vh;
position:relative;
padding:0 0 40px;
box-shadow:0 0 60px rgba(0,0,0,.5);
}
.pad{padding:0 20px}
.screen{display:none;animation:fade .35s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-size:38px;line-height:1.3;margin:0;letter-spacing:2px}
h2{font-family:var(--serif);font-size:24px;margin:0 0 14px;letter-spacing:1px}
.sub{color:var(--ink2);font-size:14px;letter-spacing:1px}
.rule{height:1px;background:var(--line);margin:18px 0}
.red{color:var(--red)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.btn{
display:block;width:100%;border:1px solid var(--ink);
background:transparent;color:var(--ink);
padding:14px 16px;font-size:17px;font-family:var(--serif);
letter-spacing:1px;transition:.15s;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#7d201b}
.btn.ghost{border-color:var(--line);color:var(--ink2);font-size:14px;padding:10px;font-family:var(--sans)}
.btn.ghost:hover{background:var(--paper2);color:var(--ink)}
#start{padding:88px 24px 40px;text-align:center}
#start .intro{color:var(--ink2);font-size:15px;margin:26px 0 40px;text-align:left;line-height:2}
.seal{
display:inline-block;border:2px solid var(--red);color:var(--red);
font-family:var(--serif);font-size:13px;padding:3px 9px;letter-spacing:3px;margin-bottom:22px;
}
.origin-card{border:1px solid var(--line);background:var(--paper2);padding:18px;margin-bottom:20px}
.origin-name{font-family:var(--serif);font-size:27px;color:var(--red);letter-spacing:2px}
.origin-desc{font-size:14px;color:var(--ink2);margin-top:8px;line-height:1.9}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:22px}
.stat{background:var(--paper);padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline}
.stat b{font-family:var(--serif);font-size:15px;font-weight:normal;letter-spacing:1px}
.stat i{font-family:var(--serif);font-size:26px;font-style:normal}
.stat.hi i{color:var(--red)}
.stat.lo i{color:#9a9188}
input[type=text]{
width:100%;padding:13px 14px;border:1px solid var(--ink);background:transparent;
font-family:var(--serif);font-size:20px;color:var(--ink);letter-spacing:2px;text-align:center;
}
input[type=text]:focus{outline:none;border-color:var(--red)}
.label{font-size:13px;color:var(--ink2);letter-spacing:2px;margin-bottom:8px}
#bar{
position:sticky;top:0;z-index:5;background:var(--paper);
border-bottom:1px solid var(--line);padding:12px 20px 10px;
}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bar-name{font-family:var(--serif);font-size:21px;letter-spacing:1px}
.bar-tag{font-size:11px;color:var(--red);border:1px solid var(--red);padding:1px 5px;vertical-align:3px;margin-left:6px;letter-spacing:1px}
.bar-tag.rank{background:var(--red);color:#fff;font-family:var(--serif)}
.bar-right{text-align:right;line-height:1.25;white-space:nowrap}
.bar-agev{display:block;font-size:12px;color:var(--ink2);letter-spacing:1px}
.bar-life{display:block;font-size:11px;color:#9a9188;letter-spacing:1px}
.bar-life.low{color:var(--red)}
.bar-life{display:block;font-size:11px;color:#9a9188;letter-spacing:1px}
.bar-life.low{color:var(--red)}
.bar-realm{
display:block;font-family:var(--serif);font-size:23px;color:var(--red);
letter-spacing:2px;transform-origin:right center;
}
.bar-realm.up{animation:realmUp 1.6s ease}
@keyframes realmUp{
0%{transform:scale(1)}
15%{transform:scale(1.45);color:#c8902a}
45%{transform:scale(1.1);color:#c8902a}
100%{transform:scale(1)}
}
.bar-stats{display:flex;gap:12px;margin-top:7px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.bar-stats span i{font-style:normal;color:var(--ink);font-family:var(--serif);font-size:15px;margin-left:3px}
.bar-status{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bar-status:empty{display:none}
.st{font-size:11px;padding:1px 6px;border:1px solid;letter-spacing:1px;white-space:nowrap}
.st.bad{color:var(--red);border-color:rgba(156,43,36,.45);background:rgba(156,43,36,.07)}
.st.good{color:#4a6b3f;border-color:rgba(74,107,63,.45);background:rgba(74,107,63,.07)}
.cult-label{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;font-size:11px;color:var(--ink2);letter-spacing:1px}
.cult-label i{font-style:normal;font-family:var(--serif);font-size:13px;color:var(--red)}
.prog{height:2px;background:var(--paper2);margin-top:4px}
.prog>div{height:100%;background:var(--red);width:0;transition:width .5s}
.ev-title{font-family:var(--serif);font-size:25px;letter-spacing:2px;margin:26px 0 4px}
.ev-stage{font-size:12px;color:var(--ink2);letter-spacing:3px}
.ev-text{margin:18px 0 26px;white-space:pre-line;line-height:2.1;font-size:16px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{
text-align:left;border:1px solid var(--line);background:var(--paper2);
padding:13px 15px;font-size:15.5px;line-height:1.7;color:var(--ink);
display:flex;gap:11px;align-items:flex-start;transition:.15s;
}
.choice:hover{border-color:var(--ink);background:var(--paper)}
.choice em{
font-style:normal;font-family:var(--serif);color:var(--red);
font-size:17px;flex:0 0 auto;line-height:1.5;
}
.result{white-space:pre-line;line-height:2.1;margin:22px 0;font-size:16px}
.tier{font-family:var(--serif);letter-spacing:4px;font-size:14px;color:var(--red);margin-top:24px}
.break{
display:inline-block;font-family:var(--serif);font-size:26px;font-weight:normal;
color:#fff;background:var(--red);padding:5px 20px;letter-spacing:6px;
animation:breakIn .7s cubic-bezier(.2,1.4,.4,1);
}
@keyframes breakIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#p-gap:not(:empty)::before{content:'　·　'}
.gain{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin-top:18px}
.gain b{font-size:11px;color:var(--ink2);font-weight:normal;letter-spacing:2px}
.gain span{
font-size:12px;padding:1px 7px;letter-spacing:1px;
color:#4a6b3f;border:1px solid rgba(74,107,63,.45);background:rgba(74,107,63,.07);
}
.gain span.minus{color:var(--red);border-color:rgba(156,43,36,.45);background:rgba(156,43,36,.07)}
.keynote{
border-left:2px solid var(--red);padding:2px 0 2px 13px;margin:20px 0 0;
color:var(--red);font-family:var(--serif);font-size:15px;line-height:1.9;
}
#logview{position:fixed;inset:0;background:rgba(20,16,14,.6);z-index:20;display:none}
#logview.on{display:block}
.log-sheet{
position:absolute;left:50%;transform:translateX(-50%);
bottom:0;width:100%;max-width:480px;max-height:85vh;overflow:auto;
background:var(--paper);padding:22px 20px 30px;
}
.log-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:14.5px;line-height:1.9}
.log-row b{font-family:var(--serif);color:var(--red);flex:0 0 86px;font-weight:normal;font-size:14px}
.log-row.quiet{color:#9a9188}
.log-row.quiet b{color:#b5aa9c}
#cardwrap{margin:20px 0}
canvas{display:block;width:100%;border:1px solid var(--line)}
.end-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.foot{color:var(--ink2);font-size:12px;text-align:center;margin-top:26px;letter-spacing:1px}
#imgsave {
position: fixed; inset: 0; z-index: 90; overflow: auto;
background: rgba(20, 16, 14, .92); padding: 18px 14px 40px;
text-align: center;
}
#imgsave .is-hint {
color: #e8dcc4; font-size: 14px; line-height: 1.8; margin: 8px 0 14px;
}
#imgsave img {
width: 100%; max-width: 420px; border-radius: 6px; display: block; margin: 0 auto;
}
#imgsave .is-close {
margin-top: 18px; padding: 10px 28px; font-size: 15px; font-family: inherit;
border: 1px solid #8a7a62; background: transparent; color: #e8dcc4; border-radius: 4px;
}
.title-row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px dotted var(--line)}
.title-row b{display:block;font-family:var(--serif);font-size:17px;font-weight:normal;letter-spacing:1px}
.title-row span{display:block;font-size:13px;color:var(--ink2);line-height:1.8}
.title-row .tier{font-family:inherit;letter-spacing:0;font-style:normal;font-size:11px;border:1px solid;padding:0 5px;margin-top:4px;min-width:34px;text-align:center;flex:0 0 auto}
.title-row .t-SSS{color:#9c2b24}.title-row .t-SS{color:#b0662a}.title-row .t-S{color:#6b5e52}.title-row .t-A{color:#9a9188}
</style>
</head>
<body>
<div id="app">
  <section id="start" class="screen on">
    <div class="seal">修仙人生</div>
    <h1>這一世<br>不太對</h1>
    <div class="sub" style="margin-top:14px">文字選擇型修仙人生模擬</div>
    <div class="intro">
      你會隨機轉世成一個人，帶著自己也沒選過的天賦、體魄與出身。<br><br>
      這一世要怎麼活，由你決定。可以拚命修仙，可以拜入宗門，可以經商，
      也可以什麼都不做，就當個普通人活到老。<br><br>
      沒有主線，沒有必勝路線。<br>
      大部分人修不成仙——這是正常的。
    </div>
    <button class="btn primary" onclick="UI.create()">開始新人生</button>
    <div class="foot" style="margin-top:56px;font-size:11px;line-height:1.9">
      試玩版 v1.0<br>玩法靈感致敬《YaKyoLife 棒球人生模擬器》
    </div>
  </section>
  <section id="create" class="screen">
    <div class="pad" style="padding-top:34px">
      <div class="sub">轉世已定</div>
      <h2 style="margin-top:6px">你這一世的起點</h2>
      <div class="origin-card">
        <div class="origin-name" id="c-origin"></div>
        <div class="origin-desc" id="c-desc"></div>
      </div>
      <div class="label">起點數值</div>
      <div class="stats" id="c-stats"></div>
      <div class="label">取個名字</div>
      <input type="text" id="c-name" maxlength="8" placeholder="請輸入姓名">
      <div style="height:18px"></div>
      <button class="btn primary" onclick="UI.begin()">開始這一世</button>
      <div style="height:10px"></div>
      <button class="btn ghost" onclick="UI.create()">再轉一次</button>
    </div>
  </section>
  <section id="play" class="screen">
    <div id="bar">
      <div class="bar-top">
        <div><span class="bar-name" id="p-name"></span><span class="bar-tag" id="p-origin"></span><span class="bar-tag rank" id="p-rank"></span></div>
        <div class="bar-right">
          <span class="bar-agev" id="p-age"></span>
          <span class="bar-life" id="p-life"></span>
          <span class="bar-realm" id="p-realm"></span>
        </div>
      </div>
      <div class="bar-stats" id="p-stats"></div>
      <div class="bar-status" id="p-status"></div>
      <div class="cult-label"><span id="p-cult"></span><i id="p-pct"></i></div>
      <div class="prog"><div id="p-prog"></div></div>
    </div>
    <div class="pad">
      <div id="ev">
        <div class="ev-stage"><span id="p-stage"></span><span id="p-gap"></span></div>
        <div class="ev-title" id="p-title"></div>
        <div class="ev-text" id="p-text"></div>
        <div class="choices" id="p-choices"></div>
      </div>
      <div id="res" style="display:none">
        <div class="tier" id="r-tier"></div>
        <div class="result" id="r-text"></div>
        <div id="r-gain"></div>
        <div id="r-judge"></div>
        <div style="height:14px"></div>
        <button class="btn" id="r-next" onclick="UI.step()">繼續</button>
      </div>
    </div>
  </section>
  <section id="end" class="screen">
    <div class="pad" style="padding-top:30px">
      <div class="sub" id="e-kind">一生已盡</div>
      <h2 style="margin-top:6px">人生總結</h2>
      <div id="cardwrap"><canvas id="card"></canvas></div>
      <div class="end-actions">
        <button class="btn primary" onclick="UI.download()">下載結局卡片</button>
        <button class="btn" onclick="UI.showLog()">查看完整人生紀錄</button>
        <button class="btn" onclick="UI.create()">再活一世</button>
      </div>
    </div>
  </section>
  <div id="logview" onclick="UI.hideLog(event)">
    <div class="log-sheet" onclick="event.stopPropagation()">
      <h2>人生紀錄</h2>
      <div id="log-list"></div>
      <div style="height:16px"></div>
      <button class="btn ghost" onclick="UI.hideLog()">關上</button>
    </div>
  </div>
